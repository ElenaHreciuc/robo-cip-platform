<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<title>Raport pe modul – ROBO-CIP</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    background: radial-gradient(circle at top, #f2fffa, #ffffff);
  }

  .page {
    max-width: 980px;
    margin: 0 auto;
  }

  h1 { margin-top: 0; }

  .panel {
    background: #ffffff;
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
  }

  .panel h2 {
    margin: 0 0 8px;
    font-size: 16px;
  }

  .list {
    display: grid;
    gap: 8px;
  }

  .entry {
    background: #f6fffa;
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    font-size: 13px;
  }

  .date {
    opacity: .7;
    font-size: 12px;
  }

  textarea {
    width: 100%;
    min-height: 90px;
    font-size: 13px;
    margin-top: 6px;
  }

  button {
    border-radius: 999px;
    border: none;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }

  .export { background: #27ae60; color: white; }
</style>
</head>

<body>
<div class="page">

<h1>📊 Raport pe modul – ROBO-CIP</h1>

<div class="panel">
  <h2>Activități înregistrate</h2>

  <div id="reportList" class="list"></div>
</div>

<div class="panel">
  <h2>Observații sintetice profesor</h2>

  <textarea id="summaryBox" placeholder="Note de sinteză asupra activității din modul..."></textarea>

  <br /><br />

  <button class="export" id="exportBtn">Exportă raportul</button>
</div>

</div>

<script>
  function loadActivities() {

    const list = document.getElementById("reportList");
    list.innerHTML = "";

    const logs = JSON.parse(localStorage.getItem("roboModuleLog") || "[]");

    if (logs.length === 0) {
      list.innerHTML = "<i>Nu există activități înregistrate pentru raport.</i>";
      return;
    }

    logs.forEach(a => {

      const entry = document.createElement("div");
      entry.className = "entry";

      entry.innerHTML = `
        <b>${a.title}</b><br>
        <span class="date">${a.date}</span><br><br>
        Tip activitate: ${a.type}<br>
        Modul: ${a.module}
      `;

      list.appendChild(entry);
    });
  }

  // export raport în format text
  document.getElementById("exportBtn").addEventListener("click", () => {

    const logs = JSON.parse(localStorage.getItem("roboModuleLog") || "[]");
    const summary = document.getElementById("summaryBox").value;

    let text = "RAPORT PE MODUL – ROBO-CIP\n\n";

    logs.forEach(a => {
      text += `${a.title}\n`;
      text += `Modul: ${a.module}\n`;
      text += `Tip activitate: ${a.type}\n`;
      text += `Data: ${a.date}\n\n`;
    });

    text += "\nOBSERVAȚII PROFESOR:\n" + summary;

    const blob = new Blob([text], { type:"text/plain" });
    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "Raport_Modul_RoboCip.txt";
    a.click();
  });

  loadActivities();
</script>

<!-- Buton global Meniu ROBO-CIP -->
<script src="/js/robo-menu-button.js"></script>
</body>
</html>
