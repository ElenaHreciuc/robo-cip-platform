<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub interdisciplinar – Robo-Cip</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:#17415d;background:linear-gradient(125deg,#e7f4ff,#effaf0);padding:20px}main{max-width:1120px;margin:auto}.hero,.workspace{background:white;border-radius:24px;padding:22px;box-shadow:0 7px 22px #1638551b;margin-bottom:18px}h1{font-size:clamp(27px,4vw,38px);margin:5px 0}p{line-height:1.5}.nav a{color:#126491}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.tile{border:2px solid #beddeb;border-radius:19px;background:#fff;padding:15px;text-align:left;color:inherit;cursor:pointer;min-height:170px}.tile b{display:block;font-size:19px}.tile.active{border-color:#148d83;background:#e6f8f1}.step{background:#f1f9ff;border-radius:13px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}.step input{width:21px;height:21px;flex:none}textarea,input[type=text]{font:inherit;width:100%;border:1px solid #a8cbd8;border-radius:11px;padding:12px}textarea{min-height:160px}button{background:#167da9;color:white;border:0;border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer;margin:8px 7px 0 0}button:hover{background:#0b608b}button:focus-visible,.tile:focus-visible,a:focus-visible{outline:3px solid #eaa742;outline-offset:3px}.secondary{background:#19876f}.hint{color:#496777;font-size:14px}.result{white-space:pre-wrap;border-left:5px solid #239982;background:#eff9f5;padding:16px;border-radius:8px;margin-top:12px}@media(max-width:750px){.cards{grid-template-columns:1fr}}@media print{.nav,.cards,button{display:none!important}.workspace{box-shadow:none}} </style></head><body><main><div class="hero"><div class="nav"><a href="/modules.html">← Module elevi</a> · <a href="/rezultate-portofolii.html">Portofolii</a></div><h1>🤖 Hub interdisciplinar</h1><p>Rezolvă o problemă reală folosind științe, matematică, algoritmi și creație.</p><label for="student">Prenume sau pseudonim (opțional)</label><input id="student" type="text" maxlength="60" placeholder="Explorator Robo-Cip"><p class="hint">Alege o provocare, bifează pașii realizați și scrie soluția ta. Lucrul se salvează numai în browserul acestui dispozitiv.</p></div><section class="cards" id="cards"></section><section class="workspace" id="workspace"><h2 id="challenge">Alege o provocare</h2><p id="question"></p><div id="steps"></div><label for="answer"><b>Ideea mea, calcule, dovezi și concluzie</b></label><textarea id="answer" placeholder="Scrie aici rezolvarea ta..."></textarea><p id="progress" class="hint" aria-live="polite"></p><button id="save" class="secondary">💾 Salvează progresul</button><button id="finish">✅ Finalizează produsul</button><button id="download">⬇ Exportă produsul .txt</button><div class="result" id="result" hidden></div></section></main><script>
(()=>{'use strict';const tasks=[["🏙️ Cartier sigur și verde","Cum transformăm drumul spre școală într-un traseu sigur?",["Observă două riscuri pe traseu și propune o măsură de siguranță.","Alege trei elemente geometrice pentru proiectarea cartierului.","Scrie o regulă DACĂ–ATUNCI pentru trecerea de pietoni.","Propune o soluție de reducere a poluării și explică de ce ajută."],"Planul cartierului cu regulă algoritmică și explicație ecologică"],["🌦️ Stație meteo creativă","Cum ne pregătim pentru o zi cu vreme schimbătoare?",["Notează trei observații despre vreme.","Compară două temperaturi inventate realist și calculează diferența.","Construiește o regulă DACĂ plouă ATUNCI...","Compune un mesaj scurt și clar de alertă pentru colegi."],"Buletin meteo, comparație numerică și alertă"],["🌉 Podul comunității","Cum proiectăm un pod stabil și accesibil?",["Descrie obstacolul ce trebuie traversat.","Desenează o structură cu forme geometrice și estimează dimensiunile.","Propune două teste de rezistență și o îmbunătățire.","Prezintă într-o poveste cine beneficiază de pod."],"Schiță explicată, plan de testare și poveste"]],key='roboCip:explore:interdisciplinar-hub.html',qs=id=>document.getElementById(id);let store={};try{store=JSON.parse(localStorage.getItem(key)||'{}')}catch{};let active=0;const cards=qs('cards'),steps=qs('steps'),answer=qs('answer');function persist(){const checked=[...steps.querySelectorAll('input')].map(x=>x.checked);store[active]={answer:answer.value,checked};store.student=qs('student').value;try{localStorage.setItem(key,JSON.stringify(store))}catch{};renderProgress()}function renderProgress(){const n=[...steps.querySelectorAll('input')].filter(x=>x.checked).length;qs('progress').textContent='Pași realizați: '+n+' din '+tasks[active][2].length+'.'}function select(i){if(cards.dataset.started==='yes')persist();active=i;cards.dataset.started='yes';[...cards.children].forEach((c,j)=>{c.classList.toggle('active',i===j);c.setAttribute('aria-pressed',String(i===j))});const t=tasks[i],saved=store[i]||{};qs('challenge').textContent=t[0];qs('question').textContent=t[1];steps.replaceChildren();t[2].forEach((s,j)=>{const l=document.createElement('label');l.className='step';const c=document.createElement('input');c.type='checkbox';c.checked=!!saved.checked?.[j];c.onchange=persist;const span=document.createElement('span');span.textContent=s;l.append(c,span);steps.append(l)});answer.value=saved.answer||'';qs('result').hidden=true;renderProgress()}tasks.forEach((t,i)=>{const b=document.createElement('button');b.className='tile';const title=document.createElement('b');title.textContent=t[0];const p=document.createElement('p');p.textContent=t[1];b.append(title,p);b.onclick=()=>select(i);cards.append(b)});qs('student').value=store.student||'';qs('student').oninput=persist;answer.oninput=persist;qs('save').onclick=()=>{persist();qs('progress').textContent+=' Progres salvat.'};function compose(){const t=tasks[active],done=[...steps.querySelectorAll('input')].filter(x=>x.checked).length;return ['ROBO-CIP · Hub interdisciplinar','Explorator: '+(qs('student').value||'Anonim'),'Provocare: '+t[0],'Întrebare: '+t[1],'Produs propus: '+t[3],'Pași realizați: '+done+'/'+t[2].length,'','Soluție și dovezi:',answer.value.trim()||'(de completat)'].join('\n')}qs('finish').onclick=()=>{persist();const el=qs('result');el.hidden=false;if(!answer.value.trim()||[...steps.querySelectorAll('input')].some(x=>!x.checked)){el.textContent='Pentru finalizare, completează soluția și bifează toți pașii. Poți salva oricând o variantă în lucru.';return}store[active].finished=true;persist();el.textContent='Produs finalizat!\n\n'+compose()};qs('download').onclick=()=>{persist();if(!answer.value.trim()){qs('progress').textContent='Scrie mai întâi o soluție pentru export.';return}const url=URL.createObjectURL(new Blob([compose()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='RoboCip_interdisciplinar-hub_produs.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};select(0)})();
</script></body></html>
