<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Științe – Robo-Cip</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;font:16px system-ui,Arial,sans-serif;background:linear-gradient(140deg,#e4f4ff,#f8fcff);color:#1b3b54}main{max-width:910px;margin:auto}.card{background:white;border-radius:19px;padding:20px;margin:12px 0;box-shadow:0 4px 16px #234e701a}h1{font-size:clamp(25px,4vw,33px);margin:0 0 8px}h2{font-size:21px}.row{display:flex;flex-wrap:wrap;gap:9px}.muted{color:#536c83}button{font:inherit;cursor:pointer;border-radius:11px;padding:11px 14px;border:0}button:focus-visible,textarea:focus-visible{outline:3px solid orange;outline-offset:2px}.age{background:#e8f5ff;border:2px solid #9dc9eb;color:#165d95;font-weight:700}.age[aria-pressed=true]{background:#176eab;color:white}.option{display:block;width:100%;text-align:left;background:#f4faff;border:2px solid #c7dff0;margin:8px 0}.option[aria-pressed=true]{background:#dff0ff;border-color:#1477bd}.primary{background:#1773ac;color:white;font-weight:700}.secondary{background:#e9f4fa;color:#155784}.scenario{padding:15px;border-left:5px solid #3f95cd;border-radius:9px;background:#eaf7ff;font-size:18px;line-height:1.5}textarea{width:100%;min-height:95px;font:inherit;border:1px solid #bdd3e5;border-radius:11px;padding:11px}.feedback{padding:14px;border-radius:12px;background:#edf6fc;margin:12px 0;line-height:1.5}.feedback.good{background:#e1f5e7;color:#1a5b36}.feedback.warn{background:#fff0db;color:#754b17}@media(max-width:500px){.card{padding:15px}}</style></head><body data-lab="nature"><main><section class="card"><h1 id="title">Laborator Științe</h1><p class="muted" id="lead"></p><div class="row"><button class="age" data-age="7-8" aria-pressed="false">7–8 ani · Descopăr</button><button class="age" data-age="8-9" aria-pressed="false">8–9 ani · Construiesc</button><button class="age" data-age="9-10" aria-pressed="false">9–10 ani · Investighez</button></div></section><section class="card"><h2 id="mission"></h2><p id="instruction"></p><div id="scenario" class="scenario"></div><div id="choices"></div><div class="row"><button id="verify" class="primary">Verifică</button><button id="next" class="secondary" hidden>Provocarea următoare →</button></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><p class="muted" id="progress"></p></section><section class="card"><h2>🔎 Misiunea mea de cercetare</h2><p id="creative"></p><textarea id="reflection" placeholder="Descrie observația, ideea sau planul tău."></textarea><p><button class="secondary" id="save">Salvează reflecția</button><span id="saveStatus" role="status"></span></p><p class="muted">Exemplele de date sunt educative sau fictive acolo unde este precizat. Nu înlocuiesc măsurătorile reale.</p></section><p><a href="/modules.html">← Înapoi la module</a></p></main><script src="/js/activity-log.js"></script><script src="/js/robo-menu-button.js"></script><script src="/science-labs.js"></script></body></html>
