<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventopia – Misiunile lui Robo-CIP</title>
  <style>
    :root {
      --blue-deep: #061a33;
     --blue-main: #0b2a4a;
      --blue-mid:  #1e5fa3;
      --text:  #0f172a;
      --muted: #334155;
      --btn-dark-1: #0e3a66;
         }

   * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: system-ui, Arial, sans-serif;
      background:
        radial-gradient(1000px 600px at 20% -10%, #1e88e5 0%, transparent 55%),
        radial-gradient(800px 500px at 85% 15%,  #0d47a1 0%, transparent 60%),
        linear-gradient(180deg, var(--blue-deep) 0%, var(--blue-main) 45%, var(--blue-mid) 100%);
    }
    .stack {
      display: grid;
      gap: 14px;
      width: min(620px, 100%);
    }
    /* CARD 3D (relief) */
    .card {
      text-align: center;
      padding: 22px 20px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,248,252,0.92));
      border: 1px solid rgba(255,255,255,.6);
      box-shadow:
        0 2px 4px rgba(255,255,255,0.7),
        0 18px 30px rgba(0,0,0,0.18),
        0 8px 12px rgba(0,0,0,0.12);
      transition: transform .25s ease, box-shadow .25s ease;
      transform: translateZ(0);
    }
    /* IMAGINE */
    .imgbox {
      width: 400px;
      height: 400px;
      margin: 0 auto 14px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.25);
      /* pentru efect 3D */
      perspective: 900px;
    }
    .imgbox img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      padding: 10px;
      border-radius: 28px;
      /* “iese din imagine” */
      transform: translateZ(0) scale(1);
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.25));
      will-change: transform;
    }
    /* ANIMAȚIA: ROBO-CIP iese din imagine */
    .imgbox.pop img {
      animation: popOut 900ms cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes popOut {
      0%   { transform: translateZ(0) translateY(0) scale(1); }
      55%  { transform: translateZ(140px) translateY(-10px) scale(1.08); }
      100% { transform: translateZ(110px) translateY(-6px) scale(1.05); }
    }
    /* Text + buton */
    h1 {
      margin: 10px 0 6px;
      font-size: 2rem;
      coor: var(--text);
    }
    .intro {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      padding: 14px 26px;
      min-height: 46px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1.1rem;
      text-decoration: none;
      color: #fff;
       background:
        radial-gradient(1000px 600px at 20% -10%, #1e88e5 0%, transparent 55%),
        radial-gradient(800px 500px at 85% 15%,  #0d47a1 0%, transparent 60%),
        linear-gradient(180deg, var(--blue-deep) 0%, var(--blue-main) 45%, var(--blue-mid) 100%);
      border: 1px solid rgba(110,203,255,0.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.14),
        0 10px 20px rgba(6,26,51,0.45);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.35),
        0 6px 12px rgba(6,26,51,0.35);
    }
    /* Card informativ */
    .info-text {
      font-size: 11px;
      line-height: 1.45;
      color: #334155;
      text-align: left;
    }
    .info-text p { margin: 0 0 6px 0; }
    .info-text ul { margin: 6px 0 0 16px; padding: 0; }
    .info-text li { margin-bottom: 4px; }
    /* Buton fallback pentru audio blocat */
    .audio-fallback {
      display: none;
      margin-top: 10px;
      font-size: 0.95rem;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(110,203,255,0.25);
      background: rgba(6,26,51,0.12);
      color: #0b2a4a;
      cursor: pointer;
      font-weight: 700;
    }
    .audio-fallback.show { display: inline-flex; align-items: center; gap: 8px; }
    @media (max-width: 420px) {
      .imgbox { width: 170px; height: 170px; }
      h1 { font-size: 1.6rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .imgbox.pop img { animation: none; transform: none; }
    }
  </style>
  <script src="/robo-voice.js"></script>
</head>

<body>
  <div class="stack">
    <!-- CARD 1 -->
    <main class="card" aria-label="Pagina de start ROBO-CIP">
      <div class="imgbox" id="roboBox">
        <img src="/assets/img/robo_hero.png" alt="ROBO-CIP">
      </div>
      <h1>Bun venit!</h1>
            <div style="margin:14px auto 2px;max-width:340px;text-align:left;">
        <label for="start-age" style="display:block;font-weight:750;font-size:1rem;color:#0b2a4a;margin-bottom:7px;">Câți ani ai?</label>
        <select id="start-age" style="width:100%;padding:12px;border-radius:12px;border:1px solid #8ebbe8;background:#fff;color:#0b2a4a;font:inherit;">
          <option value="7-8">7–8 ani · Descopăr</option>
          <option value="8-9">8–9 ani · Construiesc</option>
          <option value="9-10">9–10 ani · Investighez</option>
        </select>
      </div>
      <a class="btn" id="start-link" href="/modules.html">▶ Începe</a>
      <!-- Dacă browserul blochează vocea automată, apare acest buton -->
      <button id="enableVoice" class="audio-fallback" type="button">
        🔊 Pornește vocea
      </button>
    </main>



    <nav aria-label="Acces cadre didactice" style="text-align:center;margin:2px 0 4px;"><a href="/teacher" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#ffffffed;color:#164d77;border:1px solid #a6cbeb;border-radius:999px;padding:11px 22px;font:700 15px system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px #071a3647;">🔒 Acces profesor</a></nav>

    <!-- CARD 2 -->

    <section class="card info-text" aria-label="Descriere platformă">

      <p> 

        Împreună vom explora lumea roboților, a hărților digitale, a orașelor 3D și a sunetelor inteligente. 

 Vom descoperi secrete ale inteligenței artificiale prin activități interactive și creative. 

<center>Explorăm! Descoperim! Învățăm!<br>

  Hai să începem!</center>

      </ul>

    </section>

  </div>



  <script>
  (function() {
    const age = document.getElementById("start-age");
    const start = document.getElementById("start-link");
    const allowed = ["7-8","8-9","9-10"];
    const saved = localStorage.getItem("roboCip:ageTrack");
    if (allowed.includes(saved)) age.value = saved;
    function update() {
      localStorage.setItem("roboCip:ageTrack",age.value);
      start.href = "/modules.html?age=" + encodeURIComponent(age.value);
    }
    age.addEventListener("change",update);
    update();
  })();
  </script>
  <script>

    const roboBox = document.getElementById("roboBox");

    const enableVoiceBtn = document.getElementById("enableVoice");



    // Textul rostit (varianta cu „voce de copil” simulată)

    const textRoboCip = `

      Bine ai venit!

      Eu sunt ROBO-CIP!

  Împreună vom explora lumea roboțeilor, a hărților digitale, a orașelor 3D și a sunetelor inteligente. 

 Vom descooppeerii secrete ale inteligenței artificiale prin activități interactive și creative. 

 Explorăm! Descoperim! Învățăm!

  Hai să începem!



    `;



    function pickRomanianVoice() {

      const voices = speechSynthesis.getVoices();

      // alegem o voce română, preferabil mai “luminoasă”

      return (

        voices.find(v => v.lang === "ro-RO" && /female|google/i.test(v.name)) ||

        voices.find(v => v.lang === "ro-RO") ||

        voices[0]

      );

    }



    function speakRoboCip() {

      if (!window.RoboVoice?.supported()) return false;



      const u = new SpeechSynthesisUtterance(textRoboCip);

      u.lang = "ro-RO";



      // valori “voce de copil” (simulată)

      u.rate = 0.85;

      u.pitch = 1.15;

      u.volume = 1.0;



      const v = pickRomanianVoice();

      if (v) u.voice = v;



      try {

        return window.RoboVoice.speak("home", u, () => enableVoiceBtn.classList.add("show"));

      } catch (e) {

        return false;

      }

    }



    function startSequence() {

      // 1) ROBO-CIP iese din imagine

      roboBox.classList.add("pop");



      // 2) Încearcă să vorbească

      const ok = speakRoboCip();



      // Dacă browserul blochează autoplay, afișăm fallback

      // (nu toate browserele aruncă erori, deci butonul e “asigurare”)

      if (!ok) enableVoiceBtn.classList.add("show");

      else {

        // uneori speak() nu pornește deși nu dă eroare -> arătăm fallback preventiv după puțin timp

        setTimeout(() => {

          if (!speechSynthesis.speaking) enableVoiceBtn.classList.add("show");

        }, 800);

      }

    }



    // Pregătim încărcarea vocilor (important pe unele browsere)

    if ("speechSynthesis" in window) window.speechSynthesis.addEventListener("voiceschanged", () => {});



    // Rulează la 3 secunde după încărcare

    window.addEventListener("load", () => {

      setTimeout(startSequence, 3000);

    });



    // Fallback: la click pornește vocea (dacă a fost blocată)

    enableVoiceBtn.addEventListener("click", () => {

      enableVoiceBtn.classList.remove("show");

      speakRoboCip();

    });

  </script>

</body>

</html>
