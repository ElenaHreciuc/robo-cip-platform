<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<title>Checklist lecție pilot</title>

<style>
body { 
  font-family: system-ui, sans-serif; 
  padding:16px; 
  margin:0;
  background:#f3f6ff;
}
.card {
  background:#ffffff;
  border-radius:16px;
  padding:12px;
  margin-bottom:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
label { 
  display:block; 
  margin-top:4px; 
  font-size:14px;
}
h1 { 
  margin-top:0; 
}
</style>
</head>

<body>

<h1>🟢 Checklist lecție pilot</h1>

<div class="card">
  <b>Înainte de lecție</b>
  <label><input type="checkbox"> Aplicația funcționează (pagina principală se încarcă)</label>
  <label><input type="checkbox"> Misiunile selectate sunt verificate în prealabil</label>
  <label><input type="checkbox"> Dispozitivele elevilor / proiectorul sunt pregătite</label>
</div>

<div class="card">
  <b>În timpul lecției</b>
  <label><input type="checkbox"> Explic elevilor scopul activității</label>
  <label><input type="checkbox"> Ofer timp suficient pentru explorare</label>
  <label><input type="checkbox"> Opru activitatea pentru discuție reflexivă</label>
  <label><input type="checkbox"> Planific o pauză activă când este nevoie</label>
</div>

<div class="card">
  <b>După lecție</b>
  <label><input type="checkbox"> Notez câteva observații în jurnalul profesorului</label>
  <label><input type="checkbox"> Revăd misiunile care au ridicat dificultăți</label>
  <label><input type="checkbox"> Ajustez planul pentru următoarea lecție</label>
</div>

</body>
</html>
