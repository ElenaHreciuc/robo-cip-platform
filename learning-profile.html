<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil descriptiv – ROBO-CIP</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* ... (păstrezi stilurile tale din mesajul anterior) ... */
    :root { --blue-cip: #2e86de; --bg-cip: #f5f9ff; }
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bg-cip); }
    .container { max-width: 700px; margin: 0 auto; }
    .section { padding: 16px; background: #fff; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    textarea { width: 100%; min-height: 100px; border-radius: 12px; border: 1px solid #e2e8f0; padding: 10px; }
    .btn-export { background: var(--blue-cip); color: #fff; cursor: pointer; padding: 12px; border-radius: 12px; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-area">
      <div style="font-size: 32px;">🧾</div>
      <h1>Profil descriptiv de învățare</h1>
    </div>
    <div class="section">
      <label for="strengths">🌟 Puncte forte observate</label>
      <textarea id="strengths"></textarea>
    </div>
    <div class="section">
      <label for="strategies">🛠️ Strategii care sprijină învățarea</label>
      <textarea id="strategies"></textarea>
    </div>
    <div class="section">
      <label for="growth">🌱 Zone în dezvoltare</label>
      <textarea id="growth"></textarea>
    </div>
    <div class="actions">
      <button class="btn-export" onclick="exportProfile()">💾 Salvează ca Document</button>
      <button onclick="clearProfile()" style="cursor:pointer; border:none; background:none; color:#666;">Șterge tot</button>
    </div>
  </div>
  <script>
    const fields = ['strengths', 'strategies', 'growth'];
    fields.forEach(id => {
      const el = document.getElementById(id);
      el.value = localStorage.getItem('cip_profile_' + id) || '';
      el.addEventListener('input', () => { localStorage.setItem('cip_profile_' + id, el.value); });
    });
    function clearProfile() {
      if(confirm("Ștergi tot?")) {
        fields.forEach(id => { document.getElementById(id).value = ''; localStorage.removeItem('cip_profile_' + id); });
      }
    }
    function exportProfile() {
      const s = document.getElementById('strengths').value;
      const st = document.getElementById('strategies').value;
      const g = document.getElementById('growth').value;
      const content = `PROFIL DESCRIPTIV - ROBO-CIP\nData: ${new Date().toLocaleDateString()}\n\nPuncte forte:\n${s}\n\nStrategii:\n${st}\n\nDezvoltare:\n${g}`;
      const blob = new Blob(["\ufeff", content], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Profil_Invatare_RoboCip.txt";
      a.click();
    }
  </script>
</body>
</html>!DOCTYPE html>
