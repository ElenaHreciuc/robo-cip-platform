<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Călătoria lui ROBO-CIP – ROBO-CIP</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:#17415d;background:linear-gradient(125deg,#e7f4ff,#effaf0);padding:20px}main{max-width:1120px;margin:auto}.hero,.workspace{background:white;border-radius:24px;padding:22px;box-shadow:0 7px 22px #1638551b;margin-bottom:18px}h1{font-size:clamp(27px,4vw,38px);margin:5px 0}p{line-height:1.5}.nav a{color:#126491}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.tile{border:2px solid #beddeb;border-radius:19px;background:#fff;padding:15px;text-align:left;color:inherit;cursor:pointer;min-height:170px}.tile b{display:block;font-size:19px}.tile.active{border-color:#148d83;background:#e6f8f1}.step{background:#f1f9ff;border-radius:13px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}.step input{width:21px;height:21px;flex:none}textarea,input[type=text]{font:inherit;width:100%;border:1px solid #a8cbd8;border-radius:11px;padding:12px}textarea{min-height:160px}button{background:#167da9;color:white;border:0;border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer;margin:8px 7px 0 0}button:hover{background:#0b608b}button:focus-visible,.tile:focus-visible,a:focus-visible{outline:3px solid #eaa742;outline-offset:3px}.secondary{background:#19876f}.hint{color:#496777;font-size:14px}.result{white-space:pre-wrap;border-left:5px solid #239982;background:#eff9f5;padding:16px;border-radius:8px;margin-top:12px}@media(max-width:750px){.cards{grid-template-columns:1fr}}@media print{.nav,.cards,button{display:none!important}.workspace{box-shadow:none}} </style></head><body><main><div class="hero"><div class="nav"><a href="/modules.html">← Module elevi</a> · <a href="/rezultate-portofolii.html">Portofolii</a></div><h1>🤖 Călătoria lui ROBO-CIP</h1><p>O aventură în etape: descoperă, investighează, creează și prezintă.</p><label for="student">Prenume sau pseudonim (opțional)</label><input id="student" type="text" maxlength="60" placeholder="Explorator ROBO-CIP"><p class="hint">Alege o provocare, bifează pașii realizați și scrie soluția ta. Lucrul se salvează numai în browserul acestui dispozitiv.</p></div><section class="cards" id="cards"></section><section class="workspace" id="workspace"><h2 id="challenge">Alege o provocare</h2><p id="question"></p><div id="steps"></div><label for="answer"><b>Ideea mea, calcule, dovezi și concluzie</b></label><textarea id="answer" placeholder="Scrie aici rezolvarea ta..."></textarea><p id="progress" class="hint" aria-live="polite"></p><button id="save" class="secondary">💾 Salvează progresul</button><button id="finish">✅ Finalizează produsul</button><button id="download">⬇ Exportă produsul .txt</button><div class="result" id="result" hidden></div></section></main><script>
(() => {
  'use strict';
  const tasks = [
    ["🚀 Etapa 1 · Descoperă", "Identifică problema din oraș", [
      "Alege un loc care trebuie îmbunătățit.",
      "Descrie cui îi este dificil să îl folosească.",
      "Scrie două întrebări pentru investigație.",
      "Formulează o ipoteză."
    ], "Jurnal de descoperire"],
    ["🔎 Etapa 2 · Cercetează", "Caută dovezi", [
      "Precizează ce date ai nevoie să colectezi.",
      "Alege o metodă de observație sau măsurare.",
      "Organizează datele într-un mic tabel descris.",
      "Explică ce informație încă lipsește."
    ], "Fișă de investigație"],
    ["🛠️ Etapa 3 · Creează", "Construiește și îmbunătățește", [
      "Propune un prototip de soluție.",
      "Scrie trei pași pentru realizarea lui.",
      "Descrie un test și un criteriu de succes.",
      "Pregătește o prezentare a rezultatului."
    ], "Plan de prototip și prezentare"]
  ];
  const key = 'roboCip:explore:student-journey.html';
  const qs = id => document.getElementById(id);
  let store = {};
  try {
    const saved = JSON.parse(localStorage.getItem(key) || '{}');
    if (saved && typeof saved === 'object' && !Array.isArray(saved)) store = saved;
  } catch {}
  let active = 0;
  let storageError = false;
  const cards = qs('cards'), steps = qs('steps'), answer = qs('answer');

  function record(index) {
    const saved = store[index];
    return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
  }

  function persist() {
    const checked = [...steps.querySelectorAll('input')].map(input => input.checked);
    const previous = record(active);
    const unchanged = previous.answer === answer.value &&
      Array.isArray(previous.checked) && previous.checked.length === checked.length &&
      checked.every((value, index) => value === previous.checked[index]);
    store[active] = {
      ...previous,
      answer: answer.value,
      checked,
      finished: previous.finished === true && unchanged
    };
    store.student = qs('student').value;
    try {
      localStorage.setItem(key, JSON.stringify(store));
      storageError = false;
    } catch {
      storageError = true;
    }
    renderProgress();
    renderResult();
    return !storageError;
  }

  function renderProgress() {
    const done = [...steps.querySelectorAll('input')].filter(input => input.checked).length;
    qs('progress').textContent = 'Pași realizați: ' + done + ' din ' + tasks[active][2].length + '.' +
      (storageError ? ' Salvarea a eșuat. Păstrează o copie cu „Exportă produsul .txt”.' : '');
  }

  function renderResult() {
    const result = qs('result');
    result.hidden = record(active).finished !== true;
    if (!result.hidden) {
      const message = storageError
        ? 'Produs completat, dar salvarea a eșuat. Exportă produsul .txt.'
        : 'Produs finalizat!';
      result.textContent = message + '\n\n' + compose();
    }
  }

  function select(index) {
    if (cards.dataset.started === 'yes') persist();
    active = index;
    cards.dataset.started = 'yes';
    [...cards.children].forEach((card, i) => {
      card.classList.toggle('active', index === i);
      card.setAttribute('aria-pressed', String(index === i));
    });
    const task = tasks[index], saved = record(index);
    qs('challenge').textContent = task[0];
    qs('question').textContent = task[1];
    steps.replaceChildren();
    task[2].forEach((text, i) => {
      const label = document.createElement('label');
      label.className = 'step';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!saved.checked?.[i];
      input.onchange = persist;
      const span = document.createElement('span');
      span.textContent = text;
      label.append(input, span);
      steps.append(label);
    });
    answer.value = typeof saved.answer === 'string' ? saved.answer : '';
    renderProgress();
    renderResult();
  }

  tasks.forEach((task, index) => {
    const button = document.createElement('button');
    button.className = 'tile';
    const title = document.createElement('b');
    title.textContent = task[0];
    const description = document.createElement('p');
    description.textContent = task[1];
    button.append(title, description);
    button.onclick = () => select(index);
    cards.append(button);
  });
  qs('student').value = typeof store.student === 'string' ? store.student : '';
  qs('student').oninput = persist;
  answer.oninput = persist;
  qs('save').onclick = () => {
    if (persist()) qs('progress').textContent += ' Progres salvat.';
  };

  function compose() {
    const task = tasks[active];
    const done = [...steps.querySelectorAll('input')].filter(input => input.checked).length;
    return [
      'ROBO-CIP · Călătoria lui ROBO-CIP',
      'Explorator: ' + (qs('student').value || 'Anonim'),
      'Provocare: ' + task[0],
      'Întrebare: ' + task[1],
      'Produs propus: ' + task[3],
      'Pași realizați: ' + done + '/' + task[2].length,
      '', 'Soluție și dovezi:', answer.value.trim() || '(de completat)'
    ].join('\n');
  }

  qs('finish').onclick = () => {
    persist();
    if (!answer.value.trim() || [...steps.querySelectorAll('input')].some(input => !input.checked)) {
      qs('result').hidden = false;
      qs('result').textContent = 'Pentru finalizare, completează soluția și bifează toți pașii. Poți salva oricând o variantă în lucru.';
      return;
    }
    store[active].finished = true;
    persist();
  };

  qs('download').onclick = () => {
    persist();
    if (!answer.value.trim()) {
      qs('progress').textContent = 'Scrie mai întâi o soluție pentru export.';
      return;
    }
    const url = URL.createObjectURL(new Blob([compose()], { type: 'text/plain;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'RoboCip_student-journey_produs.txt';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const stage = Number(new URLSearchParams(location.search).get('stage'));
  select(Number.isInteger(stage) && stage >= 0 && stage < tasks.length ? stage : 0);
})();
</script></body></html>
