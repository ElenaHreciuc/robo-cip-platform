<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<title>Sinteză pe modul – Robo-Cip</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 16px;
  background: radial-gradient(circle at top, #eefefc, #ffffff);
}

.page {
  max-width: 980px;
  margin: 0 auto;
}

.section {
  background: #ffffff;
  border-radius: 18px;
  padding: 12px 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

h1 { margin-top: 0; }

.module-box {
  background: #f4fffb;
  border-radius: 14px;
  padding: 10px;
  margin-bottom: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  font-size: 13px;
}

.count {
  font-size: 12px;
  opacity: .7;
}

textarea {
  width: 100%;
  min-height: 90px;
  margin-top: 6px;
  font-size: 13px;
}

button {
  border-radius: 999px;
  border: none;
  padding: 8px 14px;
  background: #27ae60;
  color: white;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="page">

<h1>📌 Sinteză pe modul – Robo-Cip</h1>

<div class="section">
  <h2>Distribuție activități pe module</h2>

  <div id="moduleList"></div>
</div>

<div class="section">
  <h2>Observație de sinteză profesor</h2>

  <textarea id="summaryBox" placeholder="Note pedagogice asupra activităților realizate în modurile selectate..."></textarea>

  <br><br>

  <button id="exportBtn">Exportă sinteza</button>
</div>

</div>

<script>
  function buildSynthesis() {

    const logs = JSON.parse(localStorage.getItem("roboModuleLog") || "[]");
    const modules = {};

    logs.forEach(a => {
      if (!modules[a.module]) modules[a.module] = [];
      modules[a.module].push(a);
    });

    const box = document.getElementById("moduleList");
    box.innerHTML = "";

    if (logs.length === 0) {
      box.innerHTML = "<i>Nu există încă activități înregistrate.</i>";
      return;
    }

    Object.entries(modules).forEach(([name, list]) => {

      const div = document.createElement("div");
      div.className = "module-box";

      let types = {};
      list.forEach(l => {
        types[l.type] = (types[l.type] || 0) + 1;
      });

      const dist = Object.entries(types)
        .map(t => `${t[0]}: ${t[1]}`)
        .join(", ");

      div.innerHTML = `
        <b>${name}</b><br>
        <span class="count">
          Total activități: ${list.length}<br>
          Distribuție tipuri: ${dist}
        </span>
      `;

      box.appendChild(div);
    });
  }

  document.getElementById("exportBtn").addEventListener("click", () => {

    const logs = JSON.parse(localStorage.getItem("roboModuleLog") || "[]");
    const summary = document.getElementById("summaryBox").value;

    let text = "SINTEZĂ PE MODUL – ROBO-CIP\n\n";

    logs.forEach(a => {
      text += `${a.title}\n`;
      text += `Modul: ${a.module}\n`;
      text += `Tip activitate: ${a.type}\n`;
      text += `Data: ${a.date}\n\n`;
    });

    text += "\nOBSERVAȚIE DE SINTEZĂ PROFESOR:\n" + summary;

    const blob = new Blob([text], { type:"text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Sinteza_Modul_RoboCip.txt";
    a.click();
  });

  buildSynthesis();
</script>

<script src="/js/robo-menu-button.js"></script>
</body>
</html>
